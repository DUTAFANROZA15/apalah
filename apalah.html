<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Semangat Nugasnya Cantikk 💗</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Baloo+2:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Baloo 2', 'Patrick Hand', cursive, sans-serif;
    overflow-x: hidden;
  }

  #final-screen {
    min-height: 100dvh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 20px;
    background: #f7f1e8;
    background-image:
      repeating-linear-gradient(0deg, rgba(180,150,150,0.05) 0px, transparent 1px, transparent 38px, rgba(180,150,150,0.05) 39px),
      repeating-linear-gradient(90deg, rgba(180,150,150,0.05) 0px, transparent 1px, transparent 38px, rgba(180,150,150,0.05) 39px);
    text-align: center;
    overflow: hidden;
  }

  .blob-decor {
    position: absolute;
    width: 42vw;
    max-width: 420px;
    min-width: 180px;
    opacity: 0.95;
    z-index: 0;
  }
  .blob-tl { top: -6%; left: -8%; transform: rotate(0deg); }
  .blob-br { bottom: -8%; right: -8%; transform: rotate(180deg); }

  .mascot {
    position: absolute;
    z-index: 1;
    width: 22vw;
    max-width: 200px;
    min-width: 110px;
  }
  .mascot-top { top: 5%; right: 6%; }
  .mascot-bottom { bottom: 6%; left: 5%; }

  .final-content {
    position: relative;
    z-index: 2;
    padding: 20px;
  }

  .final-content h1 {
    font-family: 'Patrick Hand', cursive;
    color: #6b5b54;
    font-size: clamp(30px, 8vw, 64px);
    line-height: 1.25;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    letter-spacing: 1px;
  }

  .music-toggle {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 5;
    background: #fff;
    border: 2px solid #e8c3c3;
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.12);
  }

  .tap-hint {
    margin-top: 18px;
    font-size: 14px;
    color: #a89a90;
  }
</style>
</head>
<body>

<!-- ===================== HALAMAN UTAMA ===================== -->
<div id="final-screen">

  <!-- musik: ganti/isi file "musik.mp3" ini nanti dengan lagu pilihanmu, taruh di folder yang sama dengan file HTML ini -->
  <audio id="bg-music" loop preload="auto">
    <source src="musik.mp3" type="audio/mpeg">
  </audio>

  <!-- top-left pink blob -->
  <svg class="blob-decor blob-tl" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 L200,0 C220,60 150,90 90,110 C30,130 40,190 0,220 Z" fill="#e6c3c9"/>
    <path d="M0,0 L200,0 C220,60 150,90 90,110 C30,130 40,190 0,220" fill="none" stroke="#d9a3ac" stroke-width="3"/>
  </svg>

  <!-- bottom-right pink blob -->
  <svg class="blob-decor blob-br" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,0 L200,0 C220,60 150,90 90,110 C30,130 40,190 0,220 Z" fill="#e6c3c9"/>
    <path d="M0,0 L200,0 C220,60 150,90 90,110 C30,130 40,190 0,220" fill="none" stroke="#d9a3ac" stroke-width="3"/>
  </svg>

  <!-- top-right mascot -->
  <svg class="mascot mascot-top" viewBox="0 0 200 190" xmlns="http://www.w3.org/2000/svg">
    <line x1="10" y1="175" x2="190" y2="175" stroke="#222" stroke-width="3"/>
    <path d="M100 10 C 40 10 25 90 25 130 C25 160 60 175 100 175 C140 175 175 160 175 130 C175 90 160 10 100 10 Z"
          fill="#ffffff" stroke="#222" stroke-width="3"/>
    <circle cx="80" cy="90" r="4" fill="#222"/>
    <circle cx="118" cy="88" r="4" fill="#222"/>
    <path d="M96 100 q4 6 8 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M65 130 C 80 118 120 118 135 130 C 130 150 105 155 100 155 C 95 155 70 150 65 130 Z"
          fill="#eec9ce" stroke="#222" stroke-width="3"/>
    <path d="M100 130 L100 150" stroke="#222" stroke-width="2"/>
  </svg>

  <!-- bottom-left mascot -->
  <svg class="mascot mascot-bottom" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
    <line x1="10" y1="205" x2="210" y2="205" stroke="#222" stroke-width="3"/>
    <path d="M110 15 C60 15 45 55 55 75 C25 80 15 115 35 135 C15 150 25 185 60 190 C60 205 90 210 110 200
             C130 210 160 205 160 190 C195 185 205 150 185 135 C205 115 195 80 165 75 C175 55 160 15 110 15 Z"
          fill="#ffffff" stroke="#222" stroke-width="3"/>
    <ellipse cx="78" cy="130" rx="14" ry="10" fill="#f3b8c0" opacity="0.8"/>
    <ellipse cx="150" cy="130" rx="14" ry="10" fill="#f3b8c0" opacity="0.8"/>
    <path d="M85 118 q10 -6 20 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M125 118 q10 -6 20 0" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M100 145 C105 155 120 155 125 145" stroke="#222" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M60 190 C 70 160 90 150 100 190 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>
    <path d="M120 190 C 130 150 150 160 160 190 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>
  </svg>

  <div class="final-content">
    <h1>Semangat Nugasnya<br>Cantikk 💗</h1>
    <p class="tap-hint">🎵 tap layar untuk memutar musik jika belum terdengar</p>
  </div>
</div>

<button class="music-toggle" id="music-btn" onclick="toggleMusic()">🔊</button>

<script>
const music = document.getElementById('bg-music');
const musicBtn = document.getElementById('music-btn');
let musicPlaying = false;

function updateBtn() {
  musicBtn.textContent = musicPlaying ? '🔊' : '🔇';
}

function playMusic() {
  music.play().then(() => {
    musicPlaying = true;
    updateBtn();
  }).catch(() => {
    // browser memblokir autoplay, tunggu interaksi user (lihat listener di bawah)
    musicPlaying = false;
    updateBtn();
  });
}

function toggleMusic() {
  if (musicPlaying) {
    music.pause();
    musicPlaying = false;
  } else {
    playMusic();
    return; // updateBtn sudah dipanggil di dalam playMusic()
  }
  updateBtn();
}

// Coba putar otomatis begitu halaman dibuka
window.addEventListener('load', playMusic);

// Fallback: banyak browser (terutama iPhone) butuh sentuhan dulu sebelum audio bisa jalan
document.addEventListener('click', function firstTap() {
  if (!musicPlaying) playMusic();
  document.removeEventListener('click', firstTap);
}, { once: true });
</script>

</body>
</html>
